name: Flutter Production CI/CD

on:
  push:
    tags:
      - 'v*'  # Only run on version tags
  pull_request:
    branches: [ "master" ]

jobs:
  build_and_deploy_android:
    name: Build & Deploy Android (Production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          
      - name: Install Flutter dependencies
        run: flutter pub get

      # Create production google-services.json
      - name: Create Google Services JSON file
        run: |
          echo "${{ secrets.FIREBASE_PROD_GOOGLE_SERVICES_JSON }}" > android/app/google-services.json.b64
          base64 --decode android/app/google-services.json.b64 > android/app/google-services.json

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_PROD_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_PROD_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_PROD_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
        
      - name: Build Android App Bundle
        run: flutter build appbundle --flavor prod -t lib/main_prod.dart --release

      # Create Fastlane files for production
      - name: Create Fastlane files
        run: |
          mkdir -p android/fastlane
          echo 'json_key_file("../play-store-prod-config.json")' > android/fastlane/Appfile
          echo 'package_name("com.example.ecom_firebase")' >> android/fastlane/Appfile

      - name: Create Fastfile
        run: |
          echo 'default_platform(:android)
          platform :android do
            desc "Deploy to Play Store"
            lane :deploy do
              upload_to_play_store(
                track: "internal",
                json_key: "../play-store-prod-config.json",
                aab: "../build/app/outputs/bundle/prodRelease/app-prod-release.aab",
                release_status: "draft"
              )
            end
          end' > android/fastlane/Fastfile

      - name: Deploy to Play Store
        working-directory: android
        run: fastlane deploy
